name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore server/Rustex.sln

      - name: Build
        run: dotnet build server/Rustex.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test server/Rustex.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

  docker-build:
    name: Docker image build (sanity check)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f server/src/Rustex.Api/Dockerfile -t rustex-api:ci ./server

      - name: Build client image
        run: docker build -t rustex-client:ci ./client
